# =============================================================================
# NetAuto — Containerlab Topology
# =============================================================================
# Deploys 2 × Cisco CSR1000v (IOS-XE) routers and 2 × Alpine Linux servers.
#
# Prerequisites:
#   1. Docker installed and running
#   2. Containerlab installed  (https://containerlab.dev/install/)
#   3. CSR1000v vrnetlab image built (from lab/vrnetlab/cisco/csr1000v, with
#      the .qcow2 placed in that directory):
#        make docker-image
#      This produces the image referenced below, tagged after the qcow2
#      version (e.g. csr1000v-universalk9.16.09.05.qcow2 -> vrnetlab/cisco_csr1000v:16.09.05).
#      Note: this containerlab version has no "cisco_csr1000v" kind — CSR1000v
#      and C8000v share the same vrnetlab boot/console handling, so the image
#      is run under kind "cisco_c8000v" below.
#   4. Custom Linux image built:
#        docker build -t netauto-linux -f Dockerfile.linux .
#
# Note: CSR1000v is a full IOS-XE VM running inside a container (via
# vrnetlab) rather than a native container image — expect a few minutes
# for each router to boot before it answers SSH/NETCONF.
#
# Usage:
#   sudo containerlab deploy  -t netauto-lab.clab.yml
#   sudo containerlab destroy -t netauto-lab.clab.yml --cleanup
# =============================================================================

name: netauto

# Management network — gives every node a reachable 172.20.20.x address
mgmt:
  network: netauto-mgmt
  ipv4-subnet: 172.20.20.0/24

topology:

  defaults:
    # CSR1000v defaults (overridden per-kind below)
    kind: cisco_c8000v

  kinds:
    cisco_c8000v:
      image: vrnetlab/cisco_csr1000v:16.09.05
    linux:
      image: netauto-linux

  nodes:
    # ── Routers ──────────────────────────────────────────────────────────
    router1:
      kind: cisco_c8000v
      mgmt-ipv4: 172.20.20.11
      startup-config: configs/router1-startup.cfg
      # Ports exposed to the host for direct SSH / NETCONF access
      ports:
        - "12201:22"     # SSH
        - "12831:830"    # NETCONF

    router2:
      kind: cisco_c8000v
      mgmt-ipv4: 172.20.20.12
      startup-config: configs/router2-startup.cfg
      ports:
        - "12202:22"
        - "12832:830"

    # ── Linux Servers ────────────────────────────────────────────────────
    server1:
      kind: linux
      mgmt-ipv4: 172.20.20.21
      # exec runs inside the container after it starts
      exec:
        - ip addr add 192.168.10.10/24 dev eth1
        - ip route add 192.168.20.0/24 via 192.168.10.1

    server2:
      kind: linux
      mgmt-ipv4: 172.20.20.22
      exec:
        - ip addr add 192.168.20.10/24 dev eth1
        - ip route add 192.168.10.0/24 via 192.168.20.1

  links:
    # Router-to-router backbone  (10.10.10.0/30)
    # CSR1000v: Gi1=mgmt, Gi2+=data interfaces
    - endpoints: ["router1:Gi2", "router2:Gi2"]

    # Router-to-server LAN segments
    - endpoints: ["router1:Gi3", "server1:eth1"]   # 192.168.10.0/24
    - endpoints: ["router2:Gi3", "server2:eth1"]   # 192.168.20.0/24
