! =============================================================================
! router1 — Arista cEOS startup configuration
! =============================================================================

hostname router1

! ── Authentication ───────────────────────────────────────────────────────────
username admin privilege 15 role network-admin secret 0 admin

! Disable AAA — use local authentication only
aaa authorization exec default local

! ── Management Interface ─────────────────────────────────────────────────────
! Management0 gets its IP via Containerlab's management network (172.20.20.11)
interface Management0
   description Management
   ip address dhcp

! ── Data Interfaces ──────────────────────────────────────────────────────────
interface Ethernet1
   description Link to router2 (backbone)
   no switchport
   ip address 10.10.10.1/30
   no shutdown

interface Ethernet2
   description LAN to server1
   no switchport
   ip address 192.168.10.1/24
   no shutdown

! ── Routing ──────────────────────────────────────────────────────────────────
! Static route to server2's LAN via router2
ip route 192.168.20.0/24 10.10.10.2

! Default route via management (for internet/package access if needed)
ip routing

! ── SSH ──────────────────────────────────────────────────────────────────────
management ssh
   idle-timeout 120
   no shutdown

! ── NETCONF ──────────────────────────────────────────────────────────────────
management api netconf
   transport ssh default
   no shutdown

! ── Banner ───────────────────────────────────────────────────────────────────
banner motd
=========================================
  NetAuto Lab — router1 (Arista cEOS)
  Authorized access only.
=========================================
EOF

! ── Miscellaneous ────────────────────────────────────────────────────────────
no aaa root
service routing protocols model multi-agent
