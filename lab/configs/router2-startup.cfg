! =============================================================================
! router2 — Arista cEOS startup configuration
! =============================================================================

hostname router2

! ── Authentication ───────────────────────────────────────────────────────────
username admin privilege 15 role network-admin secret 0 admin

! Disable AAA — use local authentication only
aaa authorization exec default local

! ── Management Interface ─────────────────────────────────────────────────────
! Management0 gets its IP via Containerlab's management network (172.20.20.12)
interface Management0
   description Management
   ip address dhcp

! ── Data Interfaces ──────────────────────────────────────────────────────────
interface Ethernet1
   description Link to router1 (backbone)
   no switchport
   ip address 10.10.10.2/30
   no shutdown

interface Ethernet2
   description LAN to server2
   no switchport
   ip address 192.168.20.1/24
   no shutdown

! ── Routing ──────────────────────────────────────────────────────────────────
! Static route to server1's LAN via router1
ip route 192.168.10.0/24 10.10.10.1

! Default route via management (for internet/package access if needed)
ip routing

! ── SSH ──────────────────────────────────────────────────────────────────────
management ssh
   idle-timeout 120
   no shutdown

! ── NETCONF ──────────────────────────────────────────────────────────────────
management api netconf
   transport ssh default
   no shutdown

! ── Banner ───────────────────────────────────────────────────────────────────
banner motd
=========================================
  NetAuto Lab — router2 (Arista cEOS)
  Authorized access only.
=========================================
EOF

! ── Miscellaneous ────────────────────────────────────────────────────────────
no aaa root
service routing protocols model multi-agent
