! =============================================================================
! router1 — Cisco CSR1000v (IOS-XE) startup configuration
! =============================================================================

hostname router1

! ── Authentication ───────────────────────────────────────────────────────────
username admin privilege 15 secret 0 admin
enable secret admin

! ── Management Interface ─────────────────────────────────────────────────────
! GigabitEthernet1 is the management interface on CSR1000v.
! It gets its IP via Containerlab's management network (172.20.20.11).
interface GigabitEthernet1
 description Management
 ip address dhcp
 negotiation auto
 no shutdown

! ── Data Interfaces ──────────────────────────────────────────────────────────
interface GigabitEthernet2
 description Link to router2 (backbone)
 ip address 10.10.10.1 255.255.255.252
 negotiation auto
 no shutdown

interface GigabitEthernet3
 description LAN to server1
 ip address 192.168.10.1 255.255.255.0
 negotiation auto
 no shutdown

! ── Routing ──────────────────────────────────────────────────────────────────
! Enable IP routing
ip routing

! Static route to server2's LAN via router2
ip route 192.168.20.0 255.255.255.0 10.10.10.2

! ── SSH ──────────────────────────────────────────────────────────────────────
ip domain-name netauto.lab
crypto key generate rsa modulus 2048
ip ssh version 2

line vty 0 4
 login local
 transport input ssh
 exec-timeout 120 0

line con 0
 login local

! ── NETCONF ──────────────────────────────────────────────────────────────────
netconf-yang

! ── Banner ───────────────────────────────────────────────────────────────────
banner motd ^
=========================================
  NetAuto Lab — router1 (Cisco CSR1000v)
  Authorized access only.
=========================================
^

end
