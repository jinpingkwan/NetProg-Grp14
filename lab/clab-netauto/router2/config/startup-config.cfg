! =============================================================================
! router2 — Cisco CSR1000v (IOS-XE) startup configuration
! =============================================================================

hostname router2

! ── Authentication ───────────────────────────────────────────────────────────
username admin privilege 15 secret 0 admin
enable secret 0 admin

! Disable AAA — use local authentication only
aaa new-model
aaa authentication login default local
aaa authorization exec default local

! ── SSH ──────────────────────────────────────────────────────────────────────
! IOS-XE needs a domain name + RSA key before sshd will start.
ip domain name netauto.lab
crypto key generate rsa modulus 2048
ip ssh version 2

line vty 0 4
 login local
 transport input ssh

! ── Management Interface ─────────────────────────────────────────────────────
! GigabitEthernet1 gets its IP via Containerlab's management network (172.20.20.12)
interface GigabitEthernet1
 description Management
 ip address dhcp
 no shutdown

! ── Data Interfaces ──────────────────────────────────────────────────────────
interface GigabitEthernet2
 description Link to router1 (backbone)
 ip address 10.10.10.2 255.255.255.252
 no shutdown

interface GigabitEthernet3
 description LAN to server2
 ip address 192.168.20.1 255.255.255.0
 no shutdown

! ── Routing ──────────────────────────────────────────────────────────────────
! Static route to server1's LAN via router1
ip route 192.168.10.0 255.255.255.0 10.10.10.1

! ── NETCONF ──────────────────────────────────────────────────────────────────
netconf-yang

! ── Banner ───────────────────────────────────────────────────────────────────
banner motd ^
=========================================
  NetAuto Lab — router2 (Cisco CSR1000v)
  Authorized access only.
=========================================
^

! ── Miscellaneous ────────────────────────────────────────────────────────────
no ip domain lookup
end
