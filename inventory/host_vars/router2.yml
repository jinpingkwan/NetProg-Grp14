# =============================================================================
# host_vars/router2.yml — Router 2 specific variables
# =============================================================================

# Management IP assigned by Containerlab
ansible_host: 172.20.20.12

# Data-plane interfaces
interfaces:
  GigabitEthernet2:
    description: "Link to router1 (backbone)"
    ipv4: "10.10.10.2/30"

  GigabitEthernet3:
    description: "LAN to server2"
    ipv4: "192.168.20.1/24"

# Static routes used by playbooks/playbook.yml
static_routes:
  - dest: "192.168.10.0/24"
    via: "10.10.10.1"