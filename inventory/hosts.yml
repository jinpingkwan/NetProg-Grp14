# =============================================================================
# NetAuto — Ansible Inventory
# =============================================================================
# This file defines all hosts managed by NetAuto, grouped by type.
#
# Connection details are set in:
#   group_vars/routers.yml        — shared router settings
#   group_vars/linux_servers.yml  — shared Linux server settings
#   host_vars/<hostname>.yml      — per-host overrides (e.g. ansible_host IP)
# =============================================================================

all:
  children:

    # ── Network Devices ──────────────────────────────────────────────────────
    routers:
      hosts:
        router1:
        router2:

    # ── Linux Servers ────────────────────────────────────────────────────────
    linux_servers:
      hosts:
        server1:
        server2:
