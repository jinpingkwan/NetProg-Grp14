---
# =============================================================================
# playbooks/playbook.yml
# Complete baseline configuration for Cisco IOS-XE routers
# =============================================================================

# -----------------------------------------------------------------------------
# Play 1 - Configure Interface Descriptions
# -----------------------------------------------------------------------------
- name: Configure interface descriptions
  hosts: "{{ target_host }}"
  gather_facts: false

  tasks:

    - name: Configure interface descriptions
      cisco.ios.ios_interfaces:
        config:
          - name: GigabitEthernet2
            description: "{{ interfaces.GigabitEthernet2.description }}"
            enabled: true

          - name: GigabitEthernet3
            description: "{{ interfaces.GigabitEthernet3.description }}"
            enabled: true

        state: merged


# -----------------------------------------------------------------------------
# Play 2 - Configure Interface IP Addresses
# -----------------------------------------------------------------------------
- name: Configure interface IP addresses
  hosts: "{{ target_host }}"
  gather_facts: false

  tasks:

    - name: Configure interface IPs
      cisco.ios.ios_l3_interfaces:
        config:
          - name: GigabitEthernet2
            ipv4:
              - address: "{{ interfaces.GigabitEthernet2.ipv4 }}"

          - name: GigabitEthernet3
            ipv4:
              - address: "{{ interfaces.GigabitEthernet3.ipv4 }}"

        state: merged


# -----------------------------------------------------------------------------
# Play 3 - Configure User Account
# -----------------------------------------------------------------------------
- name: Configure user account
  hosts: "{{ target_host }}"
  gather_facts: false

  tasks:

    - name: Create administrator account
      cisco.ios.ios_config:
        lines:
          - "username {{ new_username }} privilege 15 secret 0 {{ new_password }}"


# -----------------------------------------------------------------------------
# Play 4 - Configure Banner
# -----------------------------------------------------------------------------
- name: Configure login banner
  hosts: "{{ target_host }}"
  gather_facts: false

  tasks:

    - name: Configure MOTD banner
      cisco.ios.ios_banner:
        banner: motd
        text: |
          =========================================
            NetAuto Lab — {{ inventory_hostname }}
            Authorized access only.
            Managed by Ansible.
          =========================================
        state: present


# -----------------------------------------------------------------------------
# Play 5 - Configure Static Routes
# -----------------------------------------------------------------------------
- name: Configure static routes
  hosts: "{{ target_host }}"
  gather_facts: false

  tasks:

    - name: Configure static routes
      cisco.ios.ios_static_routes:
        config:
          - address_families:
              - afi: ipv4
                routes:
                  - dest: "{{ item.dest }}"
                    next_hops:
                      - forward_router_address: "{{ item.via }}"
        state: merged

      loop: "{{ static_routes }}"


# -----------------------------------------------------------------------------
# Play 6 - Retrieve Device Information
# -----------------------------------------------------------------------------
- name: Retrieve device information
  hosts: "{{ target_host }}"
  gather_facts: false

  tasks:

    - name: Gather device facts
      cisco.ios.ios_facts:
        gather_subset:
          - default
          - interfaces

    - name: Display device information
      ansible.builtin.debug:
        msg:
          - "Hostname       : {{ ansible_net_hostname }}"
          - "IOS-XE Version : {{ ansible_net_version }}"
          - "Model          : {{ ansible_net_model }}"
          - "Serial         : {{ ansible_net_serialnum }}"
          - "Interfaces     : {{ ansible_net_interfaces.keys() | list }}"