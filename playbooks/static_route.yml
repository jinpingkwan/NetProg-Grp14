# roles/device_config/tasks/static_route.yml  — add a static route
- name: Add static route
  cisco.ios.ios_static_routes:
    config:
      - address_families:
          - afi: ipv4
            routes:
              - dest: "{{ route_dest }}"          # e.g. 10.0.0.0/24
                next_hops:
                  - forward_router_address: "{{ route_via }}"   # e.g. 10.10.10.254
    state: merged