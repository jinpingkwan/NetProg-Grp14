---
- name: Verify Linux Information
  hosts: linux_servers
  gather_facts: yes

  tasks:

    - name: Display Hostname
      debug:
        msg: "{{ ansible_hostname }}"

    - name: Display CPU
      debug:
        msg: "{{ ansible_processor_vcpus }}"

    - name: Display Memory
      debug:
        msg: "{{ ansible_memtotal_mb }} MB"

    - name: Display OS
      debug:
        msg: "{{ ansible_distribution }}"