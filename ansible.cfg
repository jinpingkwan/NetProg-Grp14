# =============================================================================
# ansible.cfg — Project-level Ansible configuration for NetAuto
# =============================================================================
# This file is auto-detected when running ansible commands from the project root.
# =============================================================================

[defaults]
# Point to our structured inventory
inventory = ./inventory/hosts.yml

# Use our local roles directory
roles_path = ./roles

# Disable retry files (they clutter the project)
retry_files_enabled = False

# Skip SSH host key checking (lab environment)
host_key_checking = False

# Shorter output for readability
stdout_callback = ansible.builtin.default
callback_whitelist = profile_tasks

# Increase parallelism (we only have 4 hosts, but set a reasonable default)
forks = 10

# Timeout for SSH connections (CSR1000v can be slow to boot)
timeout = 30

# Disable deprecation warnings for cleaner output
deprecation_warnings = False

[privilege_escalation]
become = False

[ssh_connection]
# Speed up SSH by reusing connections
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining = True
